name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: black --check --diff .

  deploy:
    strategy:
      matrix:
        version: [10, 12, 14]
        os: [ubuntu-latest, windows-latest]

    needs: build 
    runs-on: ${{ matrix.os }}
  
    steps:
      - name: Fake deploy
        run: echo Fake deploy on ${{ matrix.version }}

